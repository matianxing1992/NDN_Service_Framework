name: NDNSF-DI Spec170 iTiger GPU image

# Deliberately dispatch-only: a source push must never start an unreviewed cloud
# build. The required foundation digest is produced and tested locally first.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release ID
        required: true
        type: string
      foundation_image:
        description: Locally built NDNSF foundation as repository@sha256:digest
        required: true
        type: string
      foundation_source_revision:
        description: Exact 40-hex source revision embedded in the immutable Foundation
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: spec170-gpu-release-${{ inputs.release_id || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/matianxing1992/ndnsf-di-spec170
  RESULT_ROOT: results/spec170-itiger-qwen-live/release-build
  RELEASE_ID: ${{ inputs.release_id || format('spec170-runtime-{0}', github.sha) }}
  GPU_BUILD_BASE: docker.io/nvidia/cuda@sha256:f18cf1a9ac2842e59f13b0d0729594da8cbd68cadd2379308cdd98c0374dbd80
  GPU_RUNTIME_BASE: docker.io/nvidia/cuda@sha256:a6a8417cb56c9a5d30c4d8c78ad18bc9b75ffe4453fe1c04b3149b3741518b06
  PYTHON_BASE: docker.io/library/python@sha256:b3061b93c8df9809c3783a4f17bbf2520425ec6b40bd3e5e7538870e21ba7209
  FOUNDATION_IMAGE: ${{ inputs.foundation_image }}
  FOUNDATION_SOURCE_REVISION: ${{ inputs.foundation_source_revision }}

jobs:
  build-sign-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Reject mutable inputs and invalid identity
        shell: bash
        env:
          BUILD_BASE: ${{ env.GPU_BUILD_BASE }}
          RUNTIME_BASE: ${{ env.GPU_RUNTIME_BASE }}
          FOUNDATION: ${{ env.FOUNDATION_IMAGE }}
          FOUNDATION_REVISION: ${{ env.FOUNDATION_SOURCE_REVISION }}
          PYTHON_BASE: ${{ env.PYTHON_BASE }}
        run: |
          set -euo pipefail
          digest_ref='^[^[:space:]]+@sha256:[a-f0-9]{64}$'
          release_id='^spec170-runtime-[a-f0-9]{40}$'
          [[ "$BUILD_BASE" =~ $digest_ref ]]
          [[ "$RUNTIME_BASE" =~ $digest_ref ]]
          [[ "$FOUNDATION" =~ $digest_ref ]]
          [[ "$PYTHON_BASE" =~ $digest_ref ]]
          [[ "$FOUNDATION_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RELEASE_ID" =~ $release_id ]]

      - name: Prepare release evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_ROOT"
          printf '%s\n' \
            "workflow=${GITHUB_WORKFLOW}" \
            "runId=${GITHUB_RUN_ID}" \
            "runAttempt=${GITHUB_RUN_ATTEMPT}" \
            "sourceRevision=${GITHUB_SHA}" \
            "runUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >"$RESULT_ROOT/build-context.txt"
          df -h >"$RESULT_ROOT/runner-disk-before.txt"
          docker system df >>"$RESULT_ROOT/runner-disk-before.txt" 2>&1 || true

      - name: Preflight the local-foundation GPU assembly graph
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/ndnsf-di-container/oci/scripts/preflight-gpu-build.py \
            --workspace . \
            --output "$RESULT_ROOT/build-preflight.json"

      - name: Scan source context for secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/ndnsf-di-container/oci/scripts/scan-secrets.py \
            --path packaging/ndnsf-di-container \
            --scope source \
            --output "$RESULT_ROOT/source-secret-scan.json"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable GPU image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/ndnsf-di-container/oci/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_ID }}
          build-args: |
            FOUNDATION_IMAGE=${{ env.FOUNDATION_IMAGE }}
            FOUNDATION_SOURCE_REVISION=${{ inputs.foundation_source_revision }}
            PYTHON_BASE_IMAGE=${{ env.PYTHON_BASE }}
            GPU_BUILD_BASE_IMAGE=${{ env.GPU_BUILD_BASE }}
            GPU_RUNTIME_BASE_IMAGE=${{ env.GPU_RUNTIME_BASE }}
            SOURCE_REVISION=${{ github.sha }}
            RELEASE_ID=${{ env.RELEASE_ID }}
            ONNXRUNTIME_CPP_URL=https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-gpu-1.20.1.tgz
            ONNXRUNTIME_CPP_SHA256=6bfb87c6ebe55367a94509b8ef062239e188dccf8d5caac8d6909b2344893bf0
          cache-from: type=gha,scope=spec170-gpu
          # Preserve intermediate gpu-assembler layers (apt, ONNX SDK, and
          # locked Python environment) so a source-only correction does not
          # repeat the full dependency installation on the next release.
          cache-to: type=gha,mode=max,scope=spec170-gpu
          provenance: mode=max
          sbom: true

      - name: Record runner disk after build
        if: always()
        shell: bash
        run: |
          df -h >"$RESULT_ROOT/runner-disk-after.txt"
          docker system df >>"$RESULT_ROOT/runner-disk-after.txt" 2>&1 || true

      - name: Record Buildx metadata
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(os.environ['BUILD_METADATA'])
          Path(os.environ['RESULT_ROOT'], 'buildx-metadata.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - uses: sigstore/cosign-installer@v3.8.2
        with:
          cosign-release: v2.4.3

      - name: Sign and verify digest with GitHub OIDC identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          # cosign v2.4.3 stores the signed bundle as an OCI signature
          # attachment; --bundle is a sign-blob flag, not a v2 image-sign flag.
          cosign sign --yes "$image_ref"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ndnsf-di-itiger-image.yml@" \
            --output json "$image_ref" >"$RESULT_ROOT/cosign-verification.json"

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ env.RESULT_ROOT }}/sbom.spdx.json

      - name: Verify anonymous digest access
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config="$RUNNER_TEMP/spec170-anonymous-docker"
          mkdir -p "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect \
            "${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            >"$RESULT_ROOT/anonymous-manifest-inspect.json"

      - name: Record immutable release manifest and signature identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_BASE: ${{ env.GPU_BUILD_BASE }}
          RUNTIME_BASE: ${{ env.GPU_RUNTIME_BASE }}
          FOUNDATION: ${{ env.FOUNDATION_IMAGE }}
          FOUNDATION_REVISION: ${{ env.FOUNDATION_SOURCE_REVISION }}
          PYTHON_BASE: ${{ env.PYTHON_BASE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path

          root = Path(os.environ["RESULT_ROOT"])
          sha = lambda path: "sha256:" + hashlib.sha256(Path(path).read_bytes()).hexdigest()
          digest = os.environ["IMAGE_DIGEST"]
          verification = json.loads((root / "cosign-verification.json").read_text())
          if not verification:
              raise SystemExit("empty cosign verification")
          manifest = {
              "schemaVersion": "1.0",
              "releaseId": os.environ["RELEASE_ID"],
              "sourceRevision": os.environ["GITHUB_SHA"],
              "createdAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "images": {"linux-amd64-gpu": {
                  "reference": os.environ["IMAGE_REPOSITORY"] + "@" + digest,
                  "digest": digest,
                  "platform": "linux/amd64",
                  "backend": "onnxruntime-cuda",
              }},
              "buildInputs": [
                  {"path": "foundationImage", "digest": os.environ["FOUNDATION"].rsplit("@", 1)[1]},
                  {"path": "pythonBase", "digest": os.environ["PYTHON_BASE"].rsplit("@", 1)[1]},
                  {"path": "gpuBuildBase", "digest": os.environ["BUILD_BASE"].rsplit("@", 1)[1]},
                  {"path": "gpuRuntimeBase", "digest": os.environ["RUNTIME_BASE"].rsplit("@", 1)[1]},
                  {"path": "gpu.lock", "digest": sha("packaging/ndnsf-di-container/oci/locks/gpu.lock")},
                  {"path": "Dockerfile.gpu", "digest": sha("packaging/ndnsf-di-container/oci/Dockerfile.gpu")},
              ],
              "sbom": {"location": "sbom.spdx.json", "digest": sha(root / "sbom.spdx.json")},
              "provenance": {"builder": "github-actions/buildx", "digest": digest},
              "compatibility": {"architecture": "amd64", "cuda": "12.4", "cudnnMajor": 9},
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          signature = {
              "schemaVersion": "cosign-verification-bundle-v1",
              "verified": True,
              "imageDigest": digest,
              "issuer": "https://token.actions.githubusercontent.com",
              "subject": f"repo:{os.environ['GITHUB_REPOSITORY']}:workflow:ndnsf-di-itiger-image.yml",
              "transparencyLog": "verified-by-cosign",
              "visibility": "public",
              "authMode": "anonymous-read",
          }
          (root / "signature.json").write_text(json.dumps(signature, indent=2, sort_keys=True) + "\n")
          PY
          PYTHONPATH=packaging/ndnsf-di-container/lib python3 - <<'PY'
          from pathlib import Path
          import release
          root = Path("results/spec170-itiger-qwen-live/release-build")
          release.create_immutable_gpu_release_record(
              manifest_path=root / "release-manifest.json",
              signature_bundle_path=root / "signature.json",
              output_path=root / "runtime-release.json",
          )
          PY

      - name: Rescan release evidence and write checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/ndnsf-di-container/oci/scripts/scan-secrets.py \
            --path "$RESULT_ROOT" --scope release-evidence \
            --output "$RESULT_ROOT/release-secret-scan.json"
          find "$RESULT_ROOT" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum >"$RESULT_ROOT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec170-release-build-${{ env.RELEASE_ID }}
          path: results/spec170-itiger-qwen-live/release-build/
          if-no-files-found: error
          retention-days: 90
