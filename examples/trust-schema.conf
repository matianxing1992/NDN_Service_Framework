rule
{
  id "NDN-SVS sync interest /example"
  for interest
  filter
  {
    type name
    regex ^<example|8=example><>*<group|8=group><>*$
  }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex ^<>*$
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex ^<>*$
    }
  }
}

; The root public certificate is provisioned out of band, never learned from
; an untrusted packet or inferred from the local PIB.
trust-anchor
{
  type file
  file-name "root.cert"
}
