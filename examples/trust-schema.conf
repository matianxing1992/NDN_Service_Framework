; Structured validator config for NDNSF examples.
;
; Provision root.cert beside this configuration before starting an application.
; The root identity is the application namespace (for example /example/hello),
; and actor certificates must be signed under that root. Application Data
; names must be under the signer identity; NDN-SVS group Data is the exception
; and accepts root-chained user, provider or controller signers. Child
; certificates remain under their issuer's namespace. A certificate in the
; local PIB is not itself a trust anchor.

rule
{
  id "NDN certificates"
  for data
  filter
  {
    type name
    regex ^<>+<KEY|8=KEY><><><>$
  }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      hyper-relation
      {
        k-regex "^(<>*)<KEY|8=KEY><>{1,3}$"
        k-expand "\\1"
        h-relation is-prefix-of
        p-regex "^(<>*)$"
        p-expand "\\1"
      }
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      hyper-relation
      {
        k-regex "^(<>*)<KEY|8=KEY><>{1,3}$"
        k-expand "\\1"
        h-relation is-prefix-of
        p-regex "^(<>*)$"
        p-expand "\\1"
      }
    }
  }
}

rule
{
  id "NDNSF example runtime data"
  for data
  filter
  {
    type name
    regex ^<example|8=example><>*<NDNSF|8=NDNSF><>*$
