rule
{
  id "NDN-SVS example sync data"
  for data
  filter
  {
    type name
    regex ^<example|8=example><>*<group|8=group><>*$
  }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><hello|8=hello><user|8=user|provider|8=provider|controller|8=controller><>*<KEY|8=KEY><>{1,3}$"
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><hello|8=hello><user|8=user|provider|8=provider|controller|8=controller><>*<KEY|8=KEY><>{1,3}$"
    }
  }
}

