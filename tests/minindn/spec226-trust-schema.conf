; Fixed-root MiniNDN schema for Spec226's /example/uav campaign.
; The launcher copies this file and the campaign's root.cert into the same
; private config directory before starting any application. No `type any`.

rule
{
  id "Spec226 certificates"
  for data
  filter { type name regex ^<>+<KEY><><><>$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

; NAC-ABE publishes /<authority>/PUBPARAMS/<abe-type>/<version>. Pin both
; that exact authority namespace and its signing identity before broad rules.
rule
{
  id "Spec226 NAC public parameters"
  for data
  filter
  {
    type name
    regex ^<example|8=example><uav|8=uav><controller|8=controller><PUBPARAMS|8=PUBPARAMS><>*$
  }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><controller|8=controller><KEY|8=KEY><>{1,3}$"
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><controller|8=controller><KEY|8=KEY><>{1,3}$"
    }
  }
}

; SVS sync Data is named at the group prefix, not below the signer's identity.
rule
{
  id "Spec226 UAV group sync Data"
  for data
  filter { type name regex ^<example|8=example><uav|8=uav><v=3|54=v=3><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><drone|8=drone|source-adapter|8=source-adapter|controller|8=controller|gs|8=gs|compute|8=compute><>*<KEY|8=KEY><>{1,3}$"
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><drone|8=drone|source-adapter|8=source-adapter|controller|8=controller|gs|8=gs|compute|8=compute><>*<KEY|8=KEY><>{1,3}$"
    }
  }
}

; Controller protocol publications may use the group namespace. Keep the
; publisher fixed to the Controller identity and the data subtree exact.
rule
{
  id "Spec226 Controller protocol Data"
  for data
  filter { type name regex ^<example|8=example><uav|8=uav><NDNSF|8=NDNSF><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><controller|8=controller><KEY|8=KEY><>{1,3}$"
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><controller|8=controller><KEY|8=KEY><>{1,3}$"
    }
  }
}

; Other application Data remains hierarchical beneath the owning actor.
rule
{
  id "Spec226 actor-owned Data"
  for data
  filter { type name regex ^<example|8=example><uav|8=uav><>*$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

rule
{
  id "Spec226 signed Interests"
  for interest
  filter { type name regex ^<example|8=example><uav|8=uav><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><drone|8=drone|source-adapter|8=source-adapter|controller|8=controller|gs|8=gs|compute|8=compute><>*<KEY|8=KEY><>{1,3}$"
    }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator
    {
      type name
      regex "^<example|8=example><uav|8=uav><drone|8=drone|controller|8=controller|gs|8=gs|compute|8=compute><>*<KEY|8=KEY><>{1,3}$"
    }
  }
}

trust-anchor
{
  type file
  file-name "root.cert"
}
