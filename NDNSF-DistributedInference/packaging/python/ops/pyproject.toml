[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "ndnsf-di-ops"
version = "0.111.0"
dependencies = ["ndnsf-di-app==0.111.0"]
[project.scripts]
ndnsf-di = "ndnsf_distributed_inference.ops.cli:main"
[tool.setuptools.packages.find]
where = ["../../.."]
include = ["ndnsf_distributed_inference.ops*"]
