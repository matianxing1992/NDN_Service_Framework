[package]
name = "ndnsf-tokenizer-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "ndnsf_tokenizer_bridge"
crate-type = ["staticlib", "cdylib"]

[dependencies]
tokenizers = { version = "=0.20.3", default-features = false, features = ["onig"] }

[profile.release]
panic = "unwind"
