<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">NDN-SVS stage time scale at 1000 publications per second per peer</title>
  <desc id="desc">A logarithmic comparison shows CPU encoding and decoding stages in microseconds, network waits in milliseconds, and fetch queue waits in seconds.</desc>
  <rect width="1120" height="680" fill="#ffffff"/>
  <text x="560" y="35" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#172033">Stage-time scale at 1000 pps per peer</text>
  <text x="560" y="59" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#596273">Logarithmic axis: bar length represents orders of magnitude, not linear time</text>

  <g stroke="#d8dde8" stroke-width="1">
    <line x1="310" y1="90" x2="310" y2="610"/>
    <line x1="390" y1="90" x2="390" y2="610"/>
    <line x1="470" y1="90" x2="470" y2="610"/>
    <line x1="550" y1="90" x2="550" y2="610"/>
    <line x1="630" y1="90" x2="630" y2="610"/>
    <line x1="710" y1="90" x2="710" y2="610"/>
    <line x1="790" y1="90" x2="790" y2="610"/>
    <line x1="870" y1="90" x2="870" y2="610"/>
    <line x1="950" y1="90" x2="950" y2="610"/>
    <line x1="1030" y1="90" x2="1030" y2="610"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#4b5568" text-anchor="middle">
    <text x="310" y="630">0.1 us</text>
    <text x="390" y="630">1 us</text>
    <text x="470" y="630">10 us</text>
    <text x="550" y="630">100 us</text>
    <text x="630" y="630">1 ms</text>
    <text x="710" y="630">10 ms</text>
    <text x="790" y="630">100 ms</text>
    <text x="870" y="630">1 s</text>
    <text x="950" y="630">10 s</text>
    <text x="1030" y="630">100 s</text>
  </g>

  <g font-family="sans-serif" font-size="13" fill="#2f394b" text-anchor="end">
    <text x="294" y="119">Inner wire encode</text>
    <text x="294" y="169">Payload inner decode</text>
    <text x="294" y="219">Mapping list encode</text>
    <text x="294" y="269">Mapping list decode</text>
    <text x="294" y="319">DigestSha256 sign</text>
    <text x="294" y="369">Mapping range lookup</text>
    <text x="294" y="419">Payload network wait</text>
    <text x="294" y="469">Mapping network wait</text>
    <text x="294" y="519">Payload fetch queue</text>
    <text x="294" y="569">Mapping fetch queue</text>
  </g>

  <g>
    <rect x="310" y="101" width="3" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="151" width="76" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="201" width="132" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="251" width="161" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="301" width="175" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="351" width="196" height="26" rx="4" fill="#2879bd"/>
    <rect x="310" y="401" width="497" height="26" rx="4" fill="#78549a"/>
    <rect x="310" y="451" width="531" height="26" rx="4" fill="#78549a"/>
    <rect x="310" y="501" width="652" height="26" rx="4" fill="#c83b3b"/>
    <rect x="310" y="551" width="653" height="26" rx="4" fill="#c83b3b"/>
  </g>
  <g font-family="sans-serif" font-size="12" font-weight="700">
    <text x="321" y="119" fill="#174f7a">0.11 us</text>
    <text x="394" y="169" fill="#174f7a">0.90 us</text>
    <text x="450" y="219" fill="#174f7a">4.47 us</text>
    <text x="479" y="269" fill="#174f7a">10.31 us</text>
    <text x="493" y="319" fill="#174f7a">15.22 us</text>
    <text x="514" y="369" fill="#174f7a">28.09 us</text>
    <text x="815" y="419" fill="#563a74">160.65 ms</text>
    <text x="849" y="469" fill="#563a74">425.87 ms</text>
    <text x="970" y="519" fill="#9e2525">14.26 s</text>
    <text x="971" y="569" fill="#9e2525">14.35 s</text>
  </g>

  <g font-family="sans-serif" font-size="13">
    <rect x="310" y="650" width="18" height="12" fill="#2879bd"/><text x="336" y="661" fill="#30394b">CPU stage</text>
    <rect x="455" y="650" width="18" height="12" fill="#78549a"/><text x="481" y="661" fill="#30394b">Network wait</text>
    <rect x="630" y="650" width="18" height="12" fill="#c83b3b"/><text x="656" y="661" fill="#30394b">Fetcher queue wait</text>
  </g>
</svg>
