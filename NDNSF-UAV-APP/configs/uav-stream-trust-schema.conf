; Local UAV validation schema. Production deployments must replace the final
; `type any` anchor with the deployment root certificate file.

rule
{
  id "UAV certificates"
  for data
  filter { type name regex ^<>+<KEY><><><>$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

; Mapping and semantic payload names are both below the Provider identity.
; Hierarchical validation therefore prevents another valid drone certificate
; from publishing conflicting Data in that Provider's namespace.
rule
{
  id "UAV Provider-owned Data"
  for data
  filter { type name regex ^<example><uav><>*$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

rule
{
  id "UAV signed Interests"
  for interest
  filter { type name regex ^<example><uav><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator { type name regex ^<example><uav><>*<KEY><>{1,3}$ }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator { type name regex ^<example><uav><>*<KEY><>{1,3}$ }
  }
}

trust-anchor
{
  type any
}
