; Local UAV validation schema. Production deployments must replace the final
; `type any` anchor with the deployment root certificate file.

rule
{
  id "UAV certificates"
  for data
  filter { type name regex ^<>+<KEY><><><>$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

; SVS synchronization Data is published below a shared group prefix rather
; than below the publisher's identity. Accept it only from an authenticated
; UAV runtime identity; the trust anchor still validates the certificate.
rule
{
  id "UAV group Data"
  for data
  filter { type name regex ^<example><uav><group><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator { type name regex ^<example><uav><drone|controller|gs|compute><>*<KEY><>{1,3}$ }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator { type name regex ^<example><uav><drone|controller|gs|compute><>*<KEY><>{1,3}$ }
  }
}

; Non-group application Data remains hierarchical under its owning runtime
; identity, preventing another participant from publishing in that namespace.
rule
{
  id "UAV Provider-owned Data"
  for data
  filter { type name regex ^<example><uav><drone|controller|gs|compute><>*$ }
  checker { type hierarchical sig-type rsa-sha256 }
  checker { type hierarchical sig-type ecdsa-sha256 }
}

rule
{
  id "UAV signed Interests"
  for interest
  filter { type name regex ^<example><uav><>*$ }
  checker
  {
    type customized
    sig-type rsa-sha256
    key-locator { type name regex ^<example><uav><>*<KEY><>{1,3}$ }
  }
  checker
  {
    type customized
    sig-type ecdsa-sha256
    key-locator { type name regex ^<example><uav><>*<KEY><>{1,3}$ }
  }
}

trust-anchor
{
  type any
}
